<style>
  :root{
    --night:#1B2A4A;
    --dawn:#5B4372;
    --sunrise:#E8A857;
    --blush:#E38668;
    --paper:#FBF6EC;
    --paper-dim:#F3ECDD;
    --ink:#2B2420;
    --ink-soft:#7A6E60;
    --ok:#7C9A78;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--night);}
  body{
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #app{
    width:100%;
    max-width:440px;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }

  /* ---------- Sky header ---------- */
  .sky{
    position:relative;
    padding:26px 22px 20px;
    background:linear-gradient(180deg, var(--night) 0%, var(--dawn) 55%, var(--sunrise) 130%);
    color:#fff;
    overflow:hidden;
    transition:background 0.8s ease;
  }
  .sky::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:28px;
    background:var(--paper);
    border-radius:24px 24px 0 0;
  }
  .sky-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    position:relative; z-index:2;
  }
  .date-label{font-size:13px; letter-spacing:0.03em; opacity:0.85;}
  .greeting{font-family:'Noto Serif KR', serif; font-size:22px; font-weight:600; margin-top:6px; line-height:1.35;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.16); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.3);}

  .sun{
    position:absolute; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,235,200,0.95) 0%, rgba(232,168,87,0.35) 60%, transparent 72%);
    right:-20px; bottom:-40px; z-index:1;
    transition:transform 1.2s ease, opacity 1.2s ease;
  }

  /* progress = sunrise arc, the signature element */
  .arc-wrap{margin-top:22px; position:relative; z-index:2;}
  .arc-labels{display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.75); margin-bottom:6px;}
  .arc-track{
    height:6px; border-radius:6px; background:rgba(255,255,255,0.22); overflow:hidden;
  }
  .arc-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, #C9B8FF, var(--sunrise), #FFE9C2);
    border-radius:6px;
    transition:width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .steps-row{display:flex; justify-content:space-between; margin-top:8px;}
  .step-dot{font-size:11px; color:rgba(255,255,255,0.65); text-align:center; flex:1;}
  .step-dot.on{color:#fff; font-weight:600;}

  /* ---------- Content ---------- */
  .content{flex:1; padding:22px 22px 110px; overflow-y:auto;}
  .section{display:none;}
  .section.active{display:block; animation:rise 0.4s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-size:12px; color:var(--blush); font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; margin-bottom:8px;
  }
  .verse-card{
    background:linear-gradient(180deg, #fff, var(--paper-dim));
    border-radius:var(--radius);
    padding:26px 22px;
    border:1px solid #EADFC8;
    box-shadow:0 8px 24px rgba(43,36,32,0.06);
  }
  .verse-text{
    font-family:'Noto Serif KR', serif;
    font-size:21px;
    line-height:1.75;
    font-weight:500;
    color:var(--ink);
  }
  .verse-ref{
    margin-top:16px; font-size:14px; color:var(--ink-soft); font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .verse-ref::before{content:""; width:18px; height:1px; background:var(--blush); display:inline-block;}
  .theme-tag{
    display:inline-block; margin-top:14px; font-size:11px; padding:4px 10px;
    border-radius:20px; background:rgba(227,134,104,0.12); color:var(--blush); font-weight:600;
  }

  h2.block-title{
    font-family:'Noto Serif KR', serif; font-size:18px; font-weight:600; margin:0 0 14px;
  }
  .q-item{
    background:#fff; border:1px solid #EFE7D6; border-radius:14px;
    padding:16px; margin-bottom:12px; font-size:14.5px; line-height:1.6; color:var(--ink);
  }
  .q-item b{color:var(--blush); font-family:'Noto Serif KR', serif; margin-right:4px;}

  .q-edit-card{
    background:#fff; border:1px solid #EFE7D6; border-radius:14px; margin-bottom:12px; overflow:hidden;
  }
  .q-edit-label{
    display:flex; align-items:center; gap:6px; padding:12px 14px 0;
    font-size:12px; font-weight:700; color:var(--blush); font-family:'Noto Serif KR', serif;
  }
  .q-edit{
    width:100%; border:none; padding:6px 14px 14px; font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px; line-height:1.6; color:var(--ink); resize:vertical; min-height:56px; background:transparent;
  }
  .q-edit:focus{outline:none; background:var(--paper-dim);}
  .confirm-hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.6;}
  .confirmed-tag{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--ok);
    background:rgba(124,154,120,0.12); padding:4px 10px; border-radius:20px; margin-bottom:12px;
  }

  textarea{
    width:100%; min-height:120px; border-radius:14px; border:1px solid #EFE7D6;
    background:#fff; padding:14px; font-family:'Noto Sans KR', sans-serif; font-size:14.5px;
    line-height:1.6; color:var(--ink); resize:vertical;
  }
  textarea:focus{outline:2px solid var(--sunrise); outline-offset:1px;}
  label.field-label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:18px 0 8px;}
  label.field-label:first-of-type{margin-top:0;}

  .streak-box{
    background:linear-gradient(135deg, var(--night), var(--dawn));
    color:#fff; border-radius:var(--radius); padding:22px; text-align:center; margin-bottom:18px;
  }
  .streak-num{font-family:'Noto Serif KR', serif; font-size:40px; font-weight:700;}
  .streak-sub{font-size:13px; opacity:0.85; margin-top:4px;}
  .calendar-dots{display:flex; gap:6px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .cal-dot{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.25);}
  .cal-dot.done{background:var(--sunrise);}

  .done-check{
    width:64px; height:64px; border-radius:50%; margin:6px auto 14px;
    background:var(--ok); display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px;
  }
  .center-text{text-align:center;}
  .center-text .big{font-family:'Noto Serif KR', serif; font-size:19px; font-weight:600; margin-bottom:6px;}
  .center-text .small{font-size:13.5px; color:var(--ink-soft);}

  /* ---------- Bottom nav ---------- */
  .bottom-bar{
    position:absolute; left:0; right:0; bottom:0;
    padding:14px 22px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--paper) 65%, rgba(251,246,236,0));
    display:flex; gap:10px;
  }
  .btn{
    flex:1; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:'Noto Sans KR', sans-serif;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:active{background:#000;}
  .btn-ghost{background:#EFE7D6; color:var(--ink); flex:0 0 88px;}
  .btn-ghost:active{background:#E5D9BF;}
  .btn:disabled{opacity:0.5;}

  /* ---------- Archive overlay ---------- */
  .overlay{
    position:absolute; inset:0; background:var(--paper); z-index:10;
    display:none; flex-direction:column;
  }
  .overlay.active{display:flex;}
  .overlay-head{
    padding:22px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid #EFE7D6; background:#fff;
  }
  .overlay-head h2{font-family:'Noto Serif KR', serif; font-size:18px; margin:0;}
  .overlay-body{flex:1; overflow-y:auto; padding:16px 22px 40px;}
  .archive-item{
    background:#fff; border:1px solid #EFE7D6; border-radius:14px; padding:14px 16px; margin-bottom:10px;
  }
  .archive-date{font-size:12px; color:var(--blush); font-weight:700; margin-bottom:4px;}
  .archive-verse{font-family:'Noto Serif KR', serif; font-size:14px; color:var(--ink); margin-bottom:6px;}
  .archive-journal{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .empty-state{text-align:center; color:var(--ink-soft); font-size:14px; margin-top:60px; line-height:1.7;}

  .loading{display:flex; align-items:center; justify-content:center; height:100dvh; color:var(--ink-soft); font-size:14px;}

  /* ---------- Recitation & recording ---------- */
  .name-gate{
    background:#fff; border:1px solid #EFE7D6; border-radius:var(--radius); padding:20px; margin-bottom:18px;
  }
  .name-gate input{
    width:100%; border:1px solid #EFE7D6; border-radius:12px; padding:12px 14px; font-size:15px;
    font-family:'Noto Sans KR', sans-serif; margin-top:10px;
  }
  .name-gate input:focus{outline:2px solid var(--sunrise); outline-offset:1px;}
  .name-gate .hint{font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
  .btn-small{
    margin-top:12px; border:none; border-radius:10px; padding:10px 16px; background:var(--ink); color:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }

  .practice-card{
    background:linear-gradient(180deg, #fff, var(--paper-dim)); border:1px solid #EADFC8; border-radius:var(--radius);
    padding:22px; margin-bottom:16px; position:relative;
  }
  .practice-verse{font-family:'Noto Serif KR', serif; font-size:19px; line-height:1.85; color:var(--ink); transition:filter 0.3s ease, opacity 0.3s ease;}
  .practice-verse-ref{
    margin-top:12px; font-size:13px; color:var(--ink-soft); font-weight:600;
    display:flex; align-items:center; gap:8px; transition:filter 0.3s ease, opacity 0.3s ease;
  }
  .practice-verse-ref::before{content:""; width:16px; height:1px; background:var(--blush); display:inline-block;}
  .practice-card.recording-hide .practice-verse,
  .practice-card.recording-hide .practice-verse-ref{filter:blur(10px); opacity:0.35; user-select:none;}
  .practice-card.recording-hide .practice-controls{visibility:hidden;}
  .record-veil{
    display:none; position:absolute; inset:0; border-radius:var(--radius);
    flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;
    background:rgba(251,246,236,0.35); backdrop-filter:blur(1px);
  }

<script>
// ---------- Firebase 연결 (claude.ai 저장소 대신 사용) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAp5VxgOw67gMKmBser_nCwdRzBRrgZB8o",
  authDomain: "hagadah-cna.firebaseapp.com",
  databaseURL: "https://hagadah-cna-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hagadah-cna",
  storageBucket: "hagadah-cna.firebasestorage.app",
  messagingSenderId: "10467386431",
  appId: "1:10467386431:web:a83e1d9d0c5926c85ac48a"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

function fbPath(key){
  // "recite:2026-08-11:sujin" -> "recite/2026-08-11/sujin", 특수문자 정리
  return key.replace(/:/g, '/').replace(/[.#$\[\]]/g, '_').replace(/\/+$/, '');
}
const LOCAL_PREFIX = 'gagamook:';

// window.storage와 동일한 인터페이스: 개인 데이터는 localStorage, 공유 데이터는 Firebase
window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(LOCAL_PREFIX + key);
      return v === null ? null : {key, value:v, shared:false};
    }
    const snap = await fbDb.ref(fbPath(key)).once('value');
    if(!snap.exists()) return null;
    return {key, value: snap.val(), shared:true};
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem(LOCAL_PREFIX + key, value);
      return {key, value, shared:false};
    }
    await fbDb.ref(fbPath(key)).set(value);
    return {key, value, shared:true};
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem(LOCAL_PREFIX + key);
      return {key, deleted:true, shared:false};
    }
    await fbDb.ref(fbPath(key)).remove();
    return {key, deleted:true, shared:true};
  },
  async list(prefix, shared){
    const p = prefix || '';
    if(!shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX) === 0){
          const bare = k.slice(LOCAL_PREFIX.length);
          if(bare.indexOf(p) === 0) keys.push(bare);
        }
      }
      return {keys, prefix:p, shared:false};
    }
    const path = fbPath(p);
    const ref = path ? fbDb.ref(path) : fbDb.ref();
    const snap = await ref.once('value');
    if(!snap.exists()) return {keys:[], prefix:p, shared:true};
    const keys = [];
    snap.forEach(child => { keys.push(p + child.key); });
    return {keys, prefix:p, shared:true};
  }
};
</script>

function pad(n){return String(n).padStart(2,"0");}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function dayOfYear(d){
  const start = new Date(d.getFullYear(),0,0);
  return Math.floor((d - start) / 86400000);
}
function verseForDate(d){
  return VERSES[dayOfYear(d) % VERSES.length];
}
function weekdayKo(d){
  return ["일","월","화","수","목","금","토"][d.getDay()];
}
function weekStartDate(d){
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
function weekDatesFor(d){
  const start = weekStartDate(d);
  const arr = [];
  for(let i=0;i<7;i++){
    const dd = new Date(start); dd.setDate(start.getDate()+i);
    arr.push(dateKey(dd));
  }
  return arr;
}

function weeklyTotalsFromScoreboard(scoreboard){
  const wStart = weekStartDate(now);
  const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 7);
  return scoreboard.map(item=>{
    let weekTotal = 0;
    (item.history || []).forEach(h=>{
      const t = h && h.at ? new Date(h.at) : null;
      if(t && t >= wStart && t < wEnd) weekTotal += (h.amount || 0);
    });
    return {name: item.name, weekTotal};
  }).sort((a,b)=> b.weekTotal - a.weekTotal);
}

function nameColor(name){
  const colors = ["#5B4372","#E38668","#7C9A78","#3E6B8A","#B08968","#8A6FA0","#C97B63"];
  let h = 0;
  for(let i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
  return colors[Math.abs(h) % colors.length];
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 900;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function computeStreakFrom(items){
  // items sorted desc by date string
  const doneDates = new Set(items.filter(i=>i.completed).map(i=>i.date));
  let streak = 0;
  let cursor = new Date(now);
  while(true){
    const key = dateKey(cursor);
    if(doneDates.has(key)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

            style="width:100%; border:1px solid #EFE7D6; border-radius:10px; padding:10px 12px; font-size:14px;">
        </div>
      </div>
    `;
    bar.innerHTML = `
      <button class="btn btn-ghost" id="backBtn">이전</button>
      <button class="btn btn-primary" id="nextBtn">암송하러 가기</button>
    `;
    (async () => {
      const profile = await loadProfile();
      const shareCheck = document.getElementById("shareCheck");
      const nameWrap = document.getElementById("shareNameWrap");
      const nameInput = document.getElementById("shareNameInput");
      const syncNameVisibility = () => {
        nameWrap.style.display = (shareCheck.checked && !(profile && profile.name)) ? "block" : "none";
      };
      syncNameVisibility();
      shareCheck.onchange = syncNameVisibility;
      if(profile && profile.name && nameInput) nameInput.value = profile.name;
    })();

    function collectAnswers(){
      return Array.from(document.querySelectorAll(".answer-input"))
        .sort((a,b)=> Number(a.dataset.idx) - Number(b.dataset.idx))
        .map(el=>el.value);
    }
    function buildJournalText(qList, ansList){
      return qList.map((q,i)=> `Q${i+1}. ${q}\n${(ansList[i]||"").trim()}`).join("\n\n");
    }

    document.getElementById("backBtn").onclick = () => {
      state.answers = collectAnswers();
      state.journal = buildJournalText(qs, state.answers);
      state.prayer = document.getElementById("prayerInput").value;
      state.shareJournal = document.getElementById("shareCheck").checked;
      saveState();
      currentStep = 1; renderStep();
    };
    document.getElementById("nextBtn").onclick = async () => {
      state.answers = collectAnswers();
      state.journal = buildJournalText(qs, state.answers);
      state.prayer = document.getElementById("prayerInput").value;
      state.read = true;
      const wantsShare = document.getElementById("shareCheck").checked;
      state.shareJournal = wantsShare;

      const hasAnyAnswer = state.answers.some(a => a && a.trim());
      if(hasAnyAnswer && !state.recordPointsAwarded){
        const ok = await awardPointsToState(5, "묵상 기록 작성");
        if(ok) state.recordPointsAwarded = true;
      }

      if(wantsShare && hasAnyAnswer){
        let profile = await loadProfile();
        if(!profile || !profile.name){
          const typedName = (document.getElementById("shareNameInput").value || "").trim();
          if(typedName) profile = await saveProfile({name: typedName});
        }
        if(profile && profile.name){
          const key = `share:${today}:${slugifyName(profile.name)}`;
          const payload = {
            name: profile.name,
            ref: verse.ref,
            journal: state.journal.trim(),
            submittedAt: new Date().toISOString()
          };
          try{
            await window.storage.set(key, JSON.stringify(payload), true);
            state.journalShared = true;
          }catch(e){ console.error("journal share failed", e); }
        }
      }

      await saveState();
      currentStep = 3;
      renderStep();
    };
  }

  else if(currentStep === 3){
    renderReciteStep();
  }

  else if(currentStep === 4){
    renderPhotoStep();
  }

  else if(currentStep === 5){
    content.innerHTML = `<div id="doneWrap"><div class="center-text"><div class="loading" style="height:auto; padding:20px 0;">기록을 확인하는 중…</div></div></div>`;
    bar.innerHTML = `<button class="btn btn-primary" id="homeBtn">홈으로</button>`;
    document.getElementById("homeBtn").onclick = () => { currentStep = 0; renderStep(); };
    renderDone();
  }
}

function pickMimeType(){
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function slugifyName(name){
  return name.trim().replace(/[\s\/\\'"]+/g,'_').slice(0,40) || 'anon';
}

function wordsHtml(text){
  const words = text.split(/(\s+)/);
  return words.map((w,i)=>{
    if(/^\s+$/.test(w)) return w;
    const hidden = hiddenWords.has(i);
    return `<span class="word ${hidden?'blank':''}" data-idx="${i}">${w}</span>`;
  }).join("");
}

async function startRecording(){
  const micVisual = document.getElementById("micVisual");
  const recStatus = document.getElementById("recStatus");
  const recBtnRow = document.getElementById("recBtnRow");

  if(!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    recStatus.textContent = "이 브라우저는 녹음 기능을 지원하지 않아요. iOS는 14.3 이상, 최신 Chrome/Safari에서 시도해보세요.";
    return;
  }

  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    recStatus.textContent = "마이크 접근을 허용해야 녹음할 수 있어요. 설정을 확인해주세요.";
    return;
  }

  try{
    const mimeType = pickMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(micStream, {mimeType}) : new MediaRecorder(micStream);
  }catch(e){
    recStatus.textContent = "이 브라우저에서는 녹음을 시작할 수 없었어요. 다른 브라우저로 다시 시도해주세요.";
    micStream.getTracks().forEach(t=>t.stop());
    return;
  }
  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  const practiceCard = document.getElementById("practiceCard");
  if(practiceCard) practiceCard.classList.add("recording-hide");

  recordSeconds = 0;
  micVisual.classList.add("recording");
  micVisual.textContent = "●";
  recStatus.textContent = "녹음 중이에요. 암송을 마치면 정지를 눌러주세요.";
  document.getElementById("recTimer").textContent = "00:00";
  recBtnRow.innerHTML = `<button class="round-btn stop" id="stopRecBtn">정지</button>`;
  document.getElementById("stopRecBtn").onclick = stopRecording;

  recordTimerHandle = setInterval(()=>{
    recordSeconds++;
    const m = String(Math.floor(recordSeconds/60)).padStart(2,"0");
    const s = String(recordSeconds%60).padStart(2,"0");
    const timerEl = document.getElementById("recTimer");
    if(timerEl) timerEl.textContent = `${m}:${s}`;
    if(recordSeconds >= 60) stopRecording();
  }, 1000);
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  clearInterval(recordTimerHandle);
}

async function onRecordingStop(){
  const micVisual = document.getElementById("micVisual");
  const recStatus = document.getElementById("recStatus");
  const recBtnRow = document.getElementById("recBtnRow");
  if(micVisual){ micVisual.classList.remove("recording"); micVisual.textContent = "🎙️"; }
  const practiceCard = document.getElementById("practiceCard");
  if(practiceCard) practiceCard.classList.remove("recording-hide");

  const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
  recordedDataUrl = await new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });

  if(recStatus) recStatus.textContent = "다시 듣고 마음에 들면 제출하세요.";
  if(recBtnRow){
    recBtnRow.innerHTML = `
      <audio controls src="${recordedDataUrl}"></audio>
    `;
    const card = document.getElementById("recordCard");
    const actions = document.createElement("div");
    actions.className = "rec-btn-row";
    actions.style.marginTop = "12px";
    actions.innerHTML = `
      <button class="round-btn ghost" id="reRecBtn">다시 녹음</button>
      <button class="round-btn record" id="submitRecBtn">제출하기</button>
    `;
    card.appendChild(actions);
    document.getElementById("reRecBtn").onclick = () => { currentStep = 3; renderStep(); };
    document.getElementById("submitRecBtn").onclick = submitRecitation;
  }
}

    audio: recordedDataUrl,
    duration: recordSeconds,
    submittedAt: new Date().toISOString()
  };
  try{
    await window.storage.set(key, JSON.stringify(payload), true);
  }catch(e){
    console.error("submit failed", e);
  }
  state.reciteSubmitted = true;
  state.completed = true;
  state.completedAt = new Date().toISOString();
  await saveState();
  await awardDailyPoints(true, recordSeconds);
  currentStep = 4;
  renderStep();
}

function speedBonusFor(verseObj, durationSeconds){
  const wordCount = verseObj.text.split(/\s+/).filter(Boolean).length;
  const expected = Math.max(8, wordCount * 1.3); // 평균적으로 읽는 데 걸리는 예상 시간(초)
  const d = durationSeconds || 0;
  if(d <= 0) return {amount:2, label:"암송 완주 보너스"};
  if(d <= expected * 0.6) return {amount:10, label:"초고속 암송 보너스 ⚡"};
  if(d <= expected * 0.9) return {amount:7, label:"빠른 암송 보너스"};
  if(d <= expected * 1.3) return {amount:5, label:"암송 완주 보너스"};
  return {amount:2, label:"암송 완주 보너스"};
}

async function awardPointsToState(amount, reason){
  if(amount <= 0) return false;
  const total = await addPoints(amount, reason);
  if(total === null || total === undefined) return false; // 이름(프로필)이 아직 없으면 저장 안 됨
  state.pointsGained = (state.pointsGained || 0) + amount;
  state.totalScoreAfter = total;
  await saveState();
  return true;
}

async function awardDailyPoints(recited, durationSeconds){
  if(state.pointsAwarded) return; // 이미 성공적으로 채점됨

  const baseOk = await awardPointsToState(10, "일일 묵상 완료");
  if(!baseOk){
    // 이름(프로필)이 확인되지 않아 점수 저장 실패 — 나중에 완료 화면에서 자동 재시도
    state.pointsAwardFailed = true;
    state.pendingRecited = recited;
    state.pendingDuration = durationSeconds;
    await saveState();
    return;
  }
  state.pointsAwarded = true;
  state.pointsAwardFailed = false;

  if(recited){
    const bonus = speedBonusFor(verse, durationSeconds);
    await awardPointsToState(bonus.amount, bonus.label);
  }

  // consecutive-day streak bonus, every 3rd day
  const items = await getArchive();
  const streak = computeStreakFrom(items);
  const profile = await loadProfile();
  const lastBonusAt = profile ? profile.lastStreakBonusAt || 0 : 0;
  if(streak > 0 && streak % 3 === 0 && streak !== lastBonusAt){
    await awardPointsToState(5, `연속 ${streak}일 보너스`);
    await saveProfile({lastStreakBonusAt: streak});
  }

  const weeklyBonus = await pingWeeklyCompletion(recited);
  if(weeklyBonus){
    await awardPointsToState(weeklyBonus, "이번 주 개근 보너스");
  }
  await saveState();
}

async function loadNotices(){
  try{
    const list = await window.storage.list("notice:", true);
    if(!list || !list.keys) return [];
    const items = [];
    for(const k of list.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value){
          const data = JSON.parse(r.value);
          data.id = k.replace(/^notice:/, "");
          items.push(data);
        }
      }catch(e){}
    }
    items.sort((a,b)=> (b.createdAt || "") < (a.createdAt || "") ? -1 : ((b.createdAt||"") > (a.createdAt||"") ? 1 : 0));
    return items;
  }catch(e){ return []; }
}

      btn.disabled = false; btn.textContent = "다시 시도";
    }
  };

  renderWalkBoard(profile.name);
}

async function renderWalkBoard(myName){
  const listEl = document.getElementById("walkBoardList");
  if(!listEl) return;
  const items = await loadWalkPhotosForDate(today);
  if(items.length === 0){
    listEl.innerHTML = `<div class="empty-state">아직 오늘 나눈 사진이 없어요.<br>첫 순간을 나눠보세요.</div>`;
    return;
  }
  listEl.innerHTML = items.map(item=>{
    const isMe = item.name === myName;
    const t = item.submittedAt ? new Date(item.submittedAt) : null;
    const timeStr = t ? `${pad(t.getHours())}:${pad(t.getMinutes())}` : "";
    return `
      <div class="walk-board-item">
        <img class="walk-board-photo" src="${item.photo}" alt="${escapeHtml(item.name||"")}님이 나눈 사진">
        <div class="walk-board-info">
          <div class="board-name">${escapeHtml(item.name || "익명")} ${isMe ? '<span class="me-badge">나</span>' : ''}</div>
          <div class="board-time">${timeStr}</div>
          ${item.caption ? `<div class="walk-board-caption">${escapeHtml(item.caption)}</div>` : ''}
        </div>
      </div>
    `;
  }).join("");
}

async function openNotice(){
  const overlay = document.getElementById("noticeOverlay");
  const body = document.getElementById("noticeBody");
  overlay.classList.add("active");
  body.innerHTML = `<div class="loading" style="height:auto; padding:60px 0;">불러오는 중…</div>`;

  const profile = await loadProfile();

  if(!profile || !profile.name){
    body.innerHTML = `
      <div class="name-gate">
        <h2 class="block-title" style="margin-bottom:4px;">먼저 이름을 알려주세요</h2>
        <div class="hint" id="noticeNameHint">글이나 댓글을 쓸 때 이름으로 표시돼요. 실명이 아니어도 괜찮아요.</div>
        <input type="text" id="noticeNameInput" placeholder="예: 은혜, 김OO" maxlength="20">
        <button class="btn-small" id="noticeSaveNameBtn">저장하고 계속하기</button>
      </div>
    `;
    document.getElementById("noticeSaveNameBtn").onclick = async () => {
      const v = document.getElementById("noticeNameInput").value.trim();
      if(!v) return;

      if(check && check.name === v){ openNotice(); }
      else {
        btn.disabled = false; btn.textContent = "다시 저장하기";
        hint.innerHTML = `글이나 댓글을 쓸 때 이름으로 표시돼요.<br><span style="color:#C0392B; font-weight:700;">저장에 실패했어요. 게시(Publish) 후 다시 시도해주세요.</span>`;
      }
    };

  }

  body.innerHTML = `
    ${profile.name === ADMIN_NAME ? `
      <div class="notice-write-card">
        <h2 class="block-title" style="margin-bottom:10px;">새 공지 작성</h2>
        <textarea class="notice-write-input" id="noticeInput" placeholder="공지사항을 적어보세요."></textarea>
        <button class="btn-small" id="noticePostBtn" style="width:100%; text-align:center;">게시하기</button>
      </div>
    ` : `
      <div class="confirm-hint" style="margin-bottom:16px;">공지는 청지기만 올릴 수 있어요. 아래 글을 확인하고 댓글로 응답해보세요.</div>
    `}
    <div id="noticeListWrap"><div class="loading" style="height:auto; padding:30px 0;">불러오는 중…</div></div>
  `;

  if(profile.name === ADMIN_NAME){
    document.getElementById("noticePostBtn").onclick = async () => {
      const input = document.getElementById("noticeInput");
      const text = input.value.trim();
      if(!text) return;
      const btn = document.getElementById("noticePostBtn");
      btn.disabled = true; btn.textContent = "게시 중…";
      const ok = await postNotice(text);
      btn.disabled = false; btn.textContent = "게시하기";
      if(ok){
        input.value = "";
        renderNoticeList(profile.name);

async function renderNoticeList(myName){
  const wrap = document.getElementById("noticeListWrap");
  if(!wrap) return;
  const notices = await loadNotices();
  if(notices.length === 0){
    wrap.innerHTML = `<div class="empty-state">아직 게시글이 없어요.<br>첫 글을 남겨보세요.</div>`;
    return;
  }

  wrap.innerHTML = notices.map(n => `
    <div class="notice-card" id="notice-${n.id}">
      <div class="notice-head">
        <div class="avatar" style="width:30px; height:30px; font-size:12px; background:${nameColor(n.name||"?")}">${escapeHtml((n.name||"?").trim()[0]||"?")}</div>
        <div>
          <div class="board-name" style="margin-bottom:0;">${escapeHtml(n.name||"익명")}</div>
          <div class="notice-time">${formatNoticeTime(n.createdAt)}</div>
        </div>
      </div>
      <div class="notice-content">${escapeHtml(n.content||"")}</div>
      <div class="notice-actions">
        <button class="notice-action-btn" id="confirmBtn-${n.id}">✅ 확인 …</button>
        <button class="notice-action-btn" id="commentToggle-${n.id}">💬 댓글 …</button>
      </div>
      <div class="notice-comments" id="comments-${n.id}" style="display:none;">
        <div id="commentList-${n.id}"><div class="loading" style="height:auto; padding:12px 0;">불러오는 중…</div></div>
        <div class="notice-comment-input-row">
          <input type="text" class="notice-comment-input" id="commentInput-${n.id}" placeholder="댓글을 남겨보세요" maxlength="200">
          <button class="notice-comment-send" id="commentSend-${n.id}">등록</button>
        </div>
      </div>
    </div>
  `).join("");

  for(const n of notices){
    refreshNoticeConfirmButton(n.id, myName);

    document.getElementById(`confirmBtn-${n.id}`).onclick = async () => {
      await toggleNoticeConfirm(n.id);
      refreshNoticeConfirmButton(n.id, myName);
    };

    document.getElementById(`commentToggle-${n.id}`).onclick = async () => {
      const box = document.getElementById(`comments-${n.id}`);
      const isHidden = box.style.display === "none";
      box.style.display = isHidden ? "block" : "none";
      if(isHidden) await refreshNoticeComments(n.id, myName);
    };

    document.getElementById(`commentSend-${n.id}`).onclick = async () => {
      const input = document.getElementById(`commentInput-${n.id}`);
      const text = input.value.trim();
      if(!text) return;
      const btn = document.getElementById(`commentSend-${n.id}`);
      btn.disabled = true;
      const ok = await postNoticeComment(n.id, text);
      btn.disabled = false;
      if(ok){
        input.value = "";
        await refreshNoticeComments(n.id, myName);
        refreshNoticeCommentCount(n.id);
      }
    };

    refreshNoticeCommentCount(n.id);
  }
}

async function refreshNoticeConfirmButton(postId, myName){
  const btn = document.getElementById(`confirmBtn-${postId}`);
  if(!btn) return;
  const confirms = await loadNoticeConfirms(postId);
  const iConfirmed = confirms.some(c => c.name === myName);
  btn.textContent = `✅ 확인 ${confirms.length}`;
  btn.classList.toggle("active", iConfirmed);
}

async function refreshNoticeCommentCount(postId){
  const btn = document.getElementById(`commentToggle-${postId}`);
  if(!btn) return;
  const comments = await loadNoticeComments(postId);
  btn.textContent = `💬 댓글 ${comments.length}`;
}

async function refreshNoticeComments(postId, myName){
  const listEl = document.getElementById(`commentList-${postId}`);
  if(!listEl) return;
  const comments = await loadNoticeComments(postId);
  if(comments.length === 0){
    listEl.innerHTML = `<div class="notice-comment-item" style="color:var(--ink-soft);">아직 댓글이 없어요.</div>`;
    return;
  }
  listEl.innerHTML = comments.map(c => `
    <div class="notice-comment-item"><b>${escapeHtml(c.name||"익명")}</b>${escapeHtml(c.comment||"")}</div>
  `).join("");
}

function formatNoticeTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function openAllRecitations(){
  const overlay = document.getElementById("allRecOverlay");
  const body = document.getElementById("allRecBody");
  overlay.classList.add("active");
  body.innerHTML = `<div class="loading" style="height:auto; padding:60px 0;">불러오는 중…</div>`;

  const profile = await loadProfile();
  const dates = await loadAllRecitationDates();
  if(dates.length === 0){
    body.innerHTML = `<div class="empty-state">아직 등록된 암송 녹음이 없어요.</div>`;
    return;
  }

  const capped = dates.slice(0, 30); // 최근 30일치까지만 표시

    if(items.length === 0) continue;
    const dt = new Date(d + "T00:00:00");
    html += `<h2 class="block-title" style="margin-top:22px;">${d} (${weekdayKo(dt)})</h2>`;
    html += items.map(item=>{
      const initial = item.name ? item.name.trim()[0] : "?";
      const isMe = profile && item.name === profile.name;
      const t = item.submittedAt ? new Date(item.submittedAt) : null;
      const timeStr = t ? `${pad(t.getHours())}:${pad(t.getMinutes())}` : "";
      return `
        <div class="board-item">
          <div class="avatar" style="background:${nameColor(item.name || "?")}">${escapeHtml(initial)}</div>
          <div class="board-body">
            <div class="board-name">${escapeHtml(item.name || "익명")} ${isMe ? '<span class="me-badge">나</span>' : ''}</div>
            <div class="board-time">${timeStr} · ${escapeHtml(item.ref || "")}</div>
            <audio class="board-audio" controls src="${item.audio}"></audio>
          </div>
        </div>
      `;
    }).join("");
  }
  body.innerHTML = html || `<div class="empty-state">아직 등록된 암송 녹음이 없어요.</div>`;
}

async function renameProfile(newName){
  const profile = await loadProfile();
  const oldName = profile ? profile.name : null;
  if(!oldName){
    await saveProfile({name: newName});
    return;
  }
  if(oldName === newName) return;

  const oldSlug = slugifyName(oldName);
  const newSlug = slugifyName(newName);

  if(oldSlug !== newSlug){
    // 누적 점수 이전
    try{
      const oldScoreKey = `score:${oldSlug}`;
      const newScoreKey = `score:${newSlug}`;
      const oldR = await window.storage.get(oldScoreKey, true);
      if(oldR && oldR.value){
        const oldData = JSON.parse(oldR.value);
        let newData = {name: newName, total: 0, history: []};
        try{
          const newR = await window.storage.get(newScoreKey, true);
          if(newR && newR.value) newData = JSON.parse(newR.value);
        }catch(e){}
        newData.name = newName;
        newData.total = (newData.total || 0) + (oldData.total || 0);
        newData.history = [...(newData.history || []), ...(oldData.history || [])].slice(-60);
        await window.storage.set(newScoreKey, JSON.stringify(newData), true);
        await window.storage.delete(oldScoreKey, true);
      }
    }catch(e){ console.error("score migrate failed", e); }

    // 이번 주 진행 상황 이전
    try{
      const wKey = dateKey(weekStartDate(now));
      const oldWeekKey = `weekcomplete:${wKey}:${oldSlug}`;
      const newWeekKey = `weekcomplete:${wKey}:${newSlug}`;
      const oldR = await window.storage.get(oldWeekKey, true);
      if(oldR && oldR.value){
        const oldData = JSON.parse(oldR.value);
        oldData.name = newName;
        await window.storage.set(newWeekKey, JSON.stringify(oldData), true);
        await window.storage.delete(oldWeekKey, true);
      }
    }catch(e){ console.error("week migrate failed", e); }
  }

  await saveProfile({name: newName});
}

async function openArchive(){
  const overlay = document.getElementById("overlay");
  const body = document.getElementById("archiveBody");
  overlay.classList.add("active");
  body.innerHTML = `<div class="loading" style="height:auto; padding:60px 0;">불러오는 중…</div>`;

  const profile = await loadProfile();
  const items = await getArchive();

  const profileHtml = `
    <div class="name-gate" style="margin-bottom:22px;">
      <h2 class="block-title" style="margin-bottom:4px;">내 정보</h2>
      <div class="hint" id="profileHint">현재 닉네임: <b>${profile && profile.name ? escapeHtml(profile.name) : "설정 안 됨"}</b></div>
      <input type="text" id="profileNameInput" placeholder="새 닉네임" maxlength="20" value="${profile && profile.name ? escapeHtml(profile.name) : ""}">
      <button class="btn-small" id="profileSaveBtn">닉네임 저장</button>
    </div>
  `;

  const archiveHtml = items.length === 0
    ? `<div class="empty-state">아직 기록이 없어요.<br>오늘의 묵상을 마치면<br>이곳에 쌓이기 시작해요.</div>`
    : items.map(it => {
        const d = new Date(it.date + "T00:00:00");
        const v = verseForDate(d);
        return `
          <div class="archive-item">
            <div class="archive-date">${it.date} (${weekdayKo(d)}) ${it.completed ? "· 완료" : ""} ${it.reciteSubmitted ? "· 🎙️ 암송" : ""}</div>
            <div class="archive-verse">"${v.text}" — ${v.ref}</div>
            ${it.journal ? `<div class="archive-journal">${escapeHtml(it.journal)}</div>` : ""}
          </div>
        `;
      }).join("");

  body.innerHTML = profileHtml + `<h2 class="block-title">지난 묵상 기록</h2>` + archiveHtml;

  document.getElementById("profileSaveBtn").onclick = async () => {
    const v = document.getElementById("profileNameInput").value.trim();
    if(!v) return;
    const btn = document.getElementById("profileSaveBtn");
    const hint = document.getElementById("profileHint");
    btn.disabled = true; btn.textContent = "저장 중…";
    try{
      await renameProfile(v);
      hint.innerHTML = `현재 닉네임: <b>${escapeHtml(v)}</b><br><span style="color:var(--ok); font-weight:700;">✓ 저장됐어요. 누적 점수와 이번 주 기록도 새 이름으로 이어졌어요.</span>`;
    }catch(e){
      hint.innerHTML = `현재 닉네임: <b>${profile && profile.name ? escapeHtml(profile.name) : "설정 안 됨"}</b><br><span style="color:#C0392B; font-weight:700;">저장에 실패했어요. 다시 시도해주세요.</span>`;
    }
    btn.disabled = false; btn.textContent = "닉네임 저장";
  };
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function currentDateKey(){
  return dateKey(new Date());
}
function reloadIfNewDay(){
  if(currentDateKey() !== today){
    location.reload();
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') reloadIfNewDay();
});
window.addEventListener('pageshow', (e) => {
  if(e.persisted) reloadIfNewDay();
});
window.addEventListener('focus', reloadIfNewDay);

(async function init(){
  await loadState();
  render();
})();
</script>
